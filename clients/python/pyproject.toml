[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "likingInitiative"
version = "0.2.0"
description = "The Liking Rating Database in Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kianté Fernandez" }]
keywords = ["psychology", "decision-making", "open-data", "preference", "liking"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "polars>=0.20",
    "requests>=2.28",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kiante-fernandez/liking-rating-database"
Source = "https://github.com/kiante-fernandez/liking-rating-database"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
