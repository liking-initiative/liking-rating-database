[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "likingdb"
version = "0.1.0"
description = "Python access to the Liking Rating Database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kianté Fernandez" },
]
keywords = ["psychology", "decision-making", "open-data", "food-liking"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/kiante-fernandez/liking-rating-database"
Source = "https://github.com/kiante-fernandez/liking-rating-database"

[tool.setuptools.packages.find]
where = ["."]
include = ["likingdb*"]
