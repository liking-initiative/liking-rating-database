services:
  # Backend API Service  
  - type: web
    name: liking-rating-api
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./data/liking_rating_db.db"
      - key: SECRET_KEY
        generateValue: true
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: BACKEND_CORS_ORIGINS
        value: "https://liking-rating-frontend.onrender.com,http://localhost:3000"
      - key: TRUSTED_HOSTS
        value: "localhost,127.0.0.1,*.onrender.com"

  # Frontend Static Site
  - type: web
    name: liking-rating-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://liking-rating-api.onrender.com/api/v1"
      - key: NODE_ENV
        value: "production"