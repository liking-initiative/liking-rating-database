services:
  # PostgreSQL Database
  - type: pserv
    name: liking-rating-db
    env: python
    plan: free
    buildCommand: "echo 'Database service'"
    startCommand: "echo 'Database is managed by Render'"
    databases:
      - name: liking-rating-postgres
        databaseName: liking_rating_db
        user: liking_user

  # Backend API Service
  - type: web
    name: liking-rating-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liking-rating-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: BACKEND_CORS_ORIGINS
        value: "https://liking-rating-frontend.onrender.com,http://localhost:3000"

  # Frontend Static Site
  - type: web
    name: liking-rating-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://liking-rating-api.onrender.com/api/v1"
      - key: NODE_ENV
        value: "production"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: liking-rating-postgres
    databaseName: liking_rating_db
    user: liking_user
    plan: free