services:
  # PostgreSQL Database
  - type: pserv
    name: liking-rating-postgres
    runtime: postgres
    databaseName: liking_rating_db
    user: liking_user

  # Backend API Service
  - type: web
    name: liking-rating-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: liking-rating-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: BACKEND_CORS_ORIGINS
        value: "https://liking-rating-frontend.onrender.com,http://localhost:3000"
      - key: TRUSTED_HOSTS
        value: "localhost,127.0.0.1,*.onrender.com"

  # Frontend Static Site
  - type: web
    name: liking-rating-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    publishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://liking-rating-api.onrender.com/api/v1"
      - key: NODE_ENV
        value: "production"